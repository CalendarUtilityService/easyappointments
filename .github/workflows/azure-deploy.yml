name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-schedcal-demo-wus2-01
  PHP_VERSION: '8.3'
  NODE_VERSION: '18'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The checkout token was persisted into .git/config and shipped to the
        # web root. It expires with the job, but it should never be served.
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mysqli, curl, mbstring, gd, fileinfo, zip

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install PHP dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Install Node dependencies
      run: npm ci

    - name: Build assets
      run: npx gulp compile

    - name: Create Azure config.php
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        cat > config.php << 'EOF'
        <?php
        class Config
        {
            const BASE_URL = 'https://demo.scheducal.com';
            const LANGUAGE = 'english';
            const DEBUG_MODE = false;
            const DB_HOST = 'mysql-schedcal-demo-cus-01.mysql.database.azure.com';
            const DB_NAME = 'easyappointments';
            const DB_USERNAME = 'eaadmin';
            const DB_PASSWORD = 'PLACEHOLDER_PASSWORD';
            const GOOGLE_SYNC_FEATURE = false;
            const GOOGLE_CLIENT_ID = '';
            const GOOGLE_CLIENT_SECRET = '';
        }
        EOF
        sed -i "s/PLACEHOLDER_PASSWORD/${DB_PASSWORD}/" config.php
        sed -i 's/^        //' config.php

    # The deploy package is the whole working tree, and App Service serves
    # every file in it: /.git/config, /.git/index, /.github/workflows/* and
    # /CLAUDE.md all returned 200 from demo.scheducal.com. Strip everything
    # the running app does not need before packaging.
    - name: Strip repository-only files from the deploy package
      run: rm -rf .git .github .prawduct .claude CLAUDE.md MAINTAINING_THE_FORK.md

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
